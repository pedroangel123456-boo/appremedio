<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar App Remedios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        .qr-container img {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Descarga la App</h1>
        <p>Escanea el código con tu cámara para iniciar la descarga.</p>
        
        <div class="qr-container">
            <img id="qrImage" src="" alt="Código QR de descarga" width="250" height="250">
        </div>

        <a id="downloadLink" href="#" class="btn">Descarga Directa</a>
        
        <p style="font-size: 0.8rem; margin-top: 15px; color: #999;">
            Nota: Si Android pregunta, permite la instalación de "Fuentes desconocidas".
        </p>
    </div>

    <script>
       
        const ngrokUrl = "https://unproffered-nonsuspensive-chantal.ngrok-free.dev"; 
        
       
        const apkName = "remedios naturales";
     
        const fullPath = ngrokUrl + "/remedios_api/" + apkName;

        //  el QR usando la API de goqr.me
        const qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(fullPath);

        // Actualizamos el HTML
        document.getElementById('qrImage').src = qrApi;
        document.getElementById('downloadLink').href = fullPath;
    </script>

</body>
</html>
