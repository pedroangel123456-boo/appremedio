<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar App Remedios</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        #qr-container img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 App Remedios</h1>
        <p>Escanea para descargar o usa el botón:</p>
        
        <div id="qr-container">
            <img id="qrImage" src="" alt="Cargando QR..." width="250" height="250">
        </div>

        <a id="downloadLink" href="#" class="btn">Descargar APK</a>
        
        <p style="font-size: 0.8rem; margin-top: 20px; color: #777;">
            Si el navegador advierte sobre la descarga, selecciona "Descargar de todos modos".
        </p>
    </div>

    <script>
        
        
        const apkUrl = "https://github.com/pedroangel123456-boo/appremedio/releases/download/v1.0/app-debug.apk";


        const qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(apkUrl);

        document.getElementById('qrImage').src = qrApi;
        document.getElementById('downloadLink').href = apkUrl;
    </script>

</body>
</html>
